# .github/workflows/rdp.yml
name: Free Windows RDP Server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدة التشغيل بالساعات (1-6)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

jobs:
  rdp:
    runs-on: windows-latest
    
    steps:
    - name: 🔧 تجهيز السيرفر
      shell: pwsh
      run: |
        Write-Host "🔄 جاري تجهيز السيرفر..."
        
        # تفعيل RDP
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
        # فتح البورت في الجدار الناري
        netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
        
        # إضافة مستخدم
        net user runneradmin P@ssw0rd! /add
        net localgroup administrators runneradmin /add
        
        # منع النوم
        powercfg -change -standby-timeout-ac 0
        powercfg -change -hibernate-timeout-ac 0
        
        Write-Host "✅ تم تجهيز السيرفر"

    - name: 📡 جلب IP العام
      shell: pwsh
      run: |
        $ip = (Invoke-WebRequest -Uri "https://api.ipify.org" -UseBasicParsing).Content
        $port = 3389
        
        Write-Host "========================================"
        Write-Host "🖥️  سيرفر RDP جاهز!"
        Write-Host "========================================"
        Write-Host "📡 IP: $ip"
        Write-Host "🔌 PORT: $port"
        Write-Host "👤 USER: runneradmin"
        Write-Host "🔑 PASS: P@ssw0rd!"
        Write-Host "========================================"
        Write-Host ""
        Write-Host "🔗 للاتصال من ويندوز:"
        Write-Host "mstsc /v:${ip}:${port}"
        Write-Host ""
        Write-Host "📱 للاتصال من Termux:"
        Write-Host "xfreerdp /v:${ip}:${port} /u:runneradmin /p:P@ssw0rd! /w:1280 /h:720 /cert-ignore"
        Write-Host ""
        Write-Host "📱 للاتصال من تطبيق RD Client:"
        Write-Host "Host: $ip"
        Write-Host "Port: $port"
        Write-Host "========================================"
        
        # حفظ المعلومات في ملف
        $info = @"
========================================
🖥️  معلومات الاتصال بالسيرفر
========================================
IP: $ip
PORT: $port
USER: runneradmin
PASS: P@ssw0rd!
========================================
"@
        $info | Out-File -FilePath "$env:USERPROFILE\Desktop\rdp_info.txt"
        
        Write-Host "✅ تم حفظ المعلومات في rdp_info.txt"
        
        # إضافة متغيرات البيئة عشان تستخدمها لاحقاً
        echo "RDP_IP=$ip" >> $env:GITHUB_ENV
        echo "RDP_PORT=$port" >> $env:GITHUB_ENV

    - name: ⏰ تشغيل السيرفر
      shell: pwsh
      run: |
        $hours = ${{ github.event.inputs.duration }}
        $minutes = $hours * 60
        
        Write-Host "⏳ السيرفر شغال لمدة $hours ساعة"
        Write-Host ""
        Write-Host "📋 معلومات الاتصال:"
        Write-Host "   IP: $env:RDP_IP"
        Write-Host "   PORT: $env:RDP_PORT"
        Write-Host "   USER: runneradmin"
        Write-Host "   PASS: P@ssw0rd!"
        Write-Host ""
        Write-Host "🔗 mstsc /v:${env:RDP_IP}:${env:RDP_PORT}"
        Write-Host ""
        Write-Host "⏱️  الوقت المتبقي:"
        
        for ($i = $minutes; $i -gt 0; $i--) {
            $remaining_hours = [math]::Floor($i / 60)
            $remaining_minutes = $i % 60
            Write-Host "⏱️  متبقي: ${remaining_hours}h ${remaining_minutes}m"
            Start-Sleep -Seconds 60
        }
        
        Write-Host "⏰ انتهت مدة السيرفر"

    - name: 📊 عرض IP في النهاية
      shell: pwsh
      if: always()
      run: |
        Write-Host "========================================"
        Write-Host "📡 IP السيرفر: $env:RDP_IP"
        Write-Host "🔌 PORT: $env:RDP_PORT"
        Write-Host "👤 USER: runneradmin"
        Write-Host "🔑 PASS: P@ssw0rd!"
        Write-Host "========================================"
